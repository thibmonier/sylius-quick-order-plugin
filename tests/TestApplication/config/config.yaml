imports:
    - { resource: "@TmonierSyliusQuickOrderPlugin/config/config.yaml" }

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

# Demo data (dev and test databases): the quick order T-shirt (12 variants, QO-TEE-<SIZE>-<COLOUR>),
# a B2B buyer quickorder@example.com / sylius and two past orders of that buyer to reorder.
sylius_fixtures:
    suites:
        default:
            fixtures:
                tmonier_quick_order_demo_catalog:
                    priority: -100
                tmonier_quick_order_demo_buyer:
                    name: shop_user
                    priority: -110
                    options:
                        custom:
                            -   email: 'quickorder@example.com'
                                first_name: 'Quinn'
                                last_name: 'Buyer'
                                password: 'sylius'
                tmonier_quick_order_demo_orders:
                    name: order
                    priority: -120
                    options:
                        amount: 2
                        channel: 'FASHION_WEB'
                        customer: 'quickorder@example.com'
                        fulfilled: true

services:
    # Same id and method as tmonier/sylius-quote-request-plugin: QuoteRequestBridgePass must
    # register the quick order bridge for it.
    tmonier_quote_request.quote_cart_checker:
        class: Tests\Tmonier\SyliusQuickOrderPlugin\Cart\FakeQuoteCartChecker

    Tests\Tmonier\SyliusQuickOrderPlugin\Cart\ResetNewCartOnRequestListener:
        arguments: ['@sylius.context.cart.new_shop_based']
        tags: [{ name: kernel.event_listener, event: kernel.request, priority: 4096 }]

parameters:
    # ShopMatrixTest switches guests off with this variable set to 0.
    env(TMONIER_QUICK_ORDER_ALLOW_GUESTS): '1'

tmonier_sylius_quick_order:
    allow_guests: '%env(bool:TMONIER_QUICK_ORDER_ALLOW_GUESTS)%'

# Test-only settings and hookables (not in the dev demo).
when@test:
    tmonier_sylius_quick_order:
        matrix:
            # ShopMatrixTest: a 2-option product that keeps the core form.
            excluded_products: ['QO_TEE_EXCLUDED']
            products: ['QO_TEE_FORCED']
            # The test T-shirt has 11 enabled variants: one more keeps the core form.
            max_variants: 11

    sylius_twig_hooks:
        hooks:
            # ShopMatrixTest: the absolute hooks of the matrix page receive their context.
            'tmonier_quick_order.shop.product.matrix':
                test_extra:
                    template: 'matrix_extra.html.twig'
            'tmonier_quick_order.shop.product.add_to_cart':
                test_extra:
                    template: 'add_to_cart_extra.html.twig'
